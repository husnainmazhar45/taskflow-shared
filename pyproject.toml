[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-shared"
version = "0.1.0"
description = "Reusable foundational utilities for TaskFlow backend services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "starlette>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.16.1",
    "mypy>=1.18.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["taskflow_shared*"]

[tool.setuptools.package-data]
taskflow_shared = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
