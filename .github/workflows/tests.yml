name: Package checks

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            dependencies: minimum
          - python-version: "3.12"
            dependencies: latest
          - python-version: "3.13"
            dependencies: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]' build
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy taskflow_shared
      - name: Install minimum supported runtime dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install 'pydantic==2.11.0' 'pydantic-settings==2.0.0' 'starlette==0.30.0'
      - run: pytest
      - run: python -m build
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-smoke/bin/python" -c 'from taskflow_shared import config, contracts, enums, errors, logging, pagination'
